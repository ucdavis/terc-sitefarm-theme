global-styles:
  # Instruct Vite to compile the assets in this library
  vite: true
  css:
    theme:
      # Use the source path sass/style.scss rather than the compiled path
      # dist/style.css.
      sass/style.scss: { minified: true }
  js:
    js/main.js: { attributes: { type: 'module'}}

# Vue block-group bundles (TERC-14). One library per entry in vue/entries/.
# The drupal/vite module rewrites these source paths through the build
# manifest (dist/.vite/manifest.json) in production and proxies to the Vite
# dev server during development. Attach via PDB component info.yml
# dependencies or any block's #attached.
vue-current-conditions:
  vite: true
  js:
    vue/entries/current-conditions.ts: { attributes: { type: 'module' } }

vue-forecasted-conditions:
  vite: true
  js:
    vue/entries/forecasted-conditions.ts: { attributes: { type: 'module' } }

vue-weather-alerts:
  vite: true
  js:
    vue/entries/weather-alerts.ts: { attributes: { type: 'module' } }

# CSS of Vite's SHARED chunks (Leaflet's stylesheet, ViewTabs, SourceBadge…),
# concatenated by build/shared-css.mjs after every build. The vite module
# attaches only an entry's own CSS, and Drupal 11 does not run dynamic
# library hooks from themes, so this is a plain static library — attached
# next to each entry in terc_preprocess_block() (TERC-72).
vue-shared-css:
  css:
    component:
      dist/vue-shared.css: { minified: true }
