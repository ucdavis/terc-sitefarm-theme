# Current Conditions shell block (TERC-18). Same integration rules as
# hello_lake: no asset keys here — the entry library is attached in
# terc_preprocess_block() so pdb_vue never adds its CDN Vue.
name: 'TERC Current Conditions'
machine_name: current-conditions
type: pdb
description: 'Lake Tahoe Current Conditions shell: view navigation, destination selector, shared map region, and disclaimer. Data views arrive in their own stories.'
core_version_requirement: ^9 || ^10 || ^11
presentation: vue
category: 'TERC Lake Conditions'
template: template.html
configuration:
  showPhase:
    type: checkbox
    title: 'Show phase indicator'
    description: 'The "Phase 1/2/3" chip next to the heading.'
    default_value: 1
  showForecastLink:
    type: checkbox
    title: 'Show "Forecasted Conditions" link'
    description: 'The section at the bottom that sends visitors to the Forecasted Conditions page.'
    default_value: 1
  forecastPath:
    type: textfield
    title: 'Forecasted Conditions page path'
    description: 'Where the "See Forecasted Conditions" link points. Leave as-is unless that page moves.'
    default_value: '/forecasted-conditions'
  showSources:
    type: checkbox
    title: 'Show data-source chips'
    description: 'The chips naming the API endpoints this block reads (e.g. the TERC report API).'
    default_value: 1
  debug:
    type: checkbox
    title: 'Show cache diagnostics'
    description: 'Overlay live cache hit/miss/join statistics in the corner of the page — for debugging and demos only.'
    default_value: 0
