# Progressively Decoupled Block (PDB) component definition.
#
# Discovered by the pdb module (any *.info.yml with "type: pdb" under the
# Drupal root); pdb_vue's "vue_component" block deriver picks it up because
# presentation is "vue", making it placeable in any block UI.
#
# Note: no add_js/add_css/libraries keys, deliberately. Declaring
# "libraries:" here makes pdb_vue force-attach its CDN global Vue build,
# which would double-load Vue next to the theme's bundled ESM entry.
# The entry library (terc/vue-current-conditions) is attached instead in
# terc_preprocess_block() — see terc.theme.
name: 'TERC Hello Lake (scaffolding demo)'
machine_name: hello-lake
type: pdb
description: 'Demo block proving the Vue decoupled-block pipeline (TERC-15). Replaced by real Current Conditions blocks.'
core_version_requirement: ^9 || ^10 || ^11
presentation: vue
category: 'TERC Lake Conditions'
template: template.html
configuration:
  title:
    type: textfield
    title: 'Title'
    description: 'Heading shown above the demo block. Leave empty for the component default.'
    default_value: ''
  stationId:
    type: textfield
    title: 'Station id'
    description: 'Near-shore station id (1-12). Reporting stations as of Aug 2026: 2 Dollar Point, 4 Homewood, 6 Rubicon, 8 Tahoe Vista.'
    default_value: '2'
  debug:
    type: checkbox
    title: 'Show cache diagnostics'
    description: 'Overlay live cache hit/miss/join statistics in the corner of the page — for debugging only.'
    default_value: 0
