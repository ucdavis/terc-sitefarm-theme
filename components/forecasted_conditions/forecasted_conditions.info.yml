# Forecasted Conditions shell block (TERC-22). Same integration rules as
# the other PDB components: no asset keys here — the entry library is
# attached in terc_preprocess_block() so pdb_vue never adds its CDN Vue.
name: 'TERC Forecasted Conditions'
machine_name: forecasted-conditions
type: pdb
description: 'Lake Tahoe Forecasted Conditions shell: modeled-view navigation, shared date/hour selector with 24-hour playback, and the lake map stage. The Water Temperature, Currents, and Wave Height layers arrive in their own stories.'
core_version_requirement: ^9 || ^10 || ^11
presentation: vue
category: 'TERC Lake Conditions'
template: template.html
configuration:
  showSources:
    type: checkbox
    title: 'Show data-source chips'
    description: 'The chips naming the data sources this block reads (the modeled-conditions S3 bucket).'
    default_value: 1
  debug:
    type: checkbox
    title: 'Show cache diagnostics'
    description: 'Overlay live cache hit/miss/join statistics in the corner of the page — for debugging and demos only.'
    default_value: 0
  realTimePath:
    type: textfield
    title: 'Real-Time Conditions page path'
    description: 'Where the "See Real-Time Conditions" link points. Leave as-is unless that page moves.'
    default_value: '/real-time-conditions'
  # Editor-owned copy (TERC-9). Plain text; a blank line starts a new
  # paragraph. Leaving a field empty restores the default text.
  introText:
    type: textarea
    title: 'Introduction'
    description: 'Shown under the block heading, above the view tabs. A blank line starts a new paragraph.'
    default_value: 'Model-based forecasts of lake conditions, updated daily. Pick a date and hour — your selection follows you between views — or press “Next 24 h” to watch conditions evolve.'
  waterTemperatureText:
    type: textarea
    title: 'Water Temperature description'
    description: 'Shown beside the Water Temperature view (below it on small screens). A blank line starts a new paragraph.'
    default_value: |-
      Lake-wide forecasted surface temperature. The lake is not one temperature — cold upwellings can chill a shoreline overnight.

      The lake is never one temperature — wind can pull deep, cold water to the surface overnight (an upwelling), chilling a shoreline that was comfortable the day before. Even on warm days, water below the surface layer stays dangerously cold — sudden immersion can cause cold-water shock. Enter gradually, stay close to shore, and wear a life vest on any craft.
  currentsText:
    type: textarea
    title: 'Currents description'
    description: 'Shown beside the Currents view (below it on small screens). A blank line starts a new paragraph.'
    default_value: |-
      Forecasted water movement across the lake, including the gyres and rip currents that matter to swimmers and paddleboarders.

      Lake Tahoe's water is always moving. Large, slow gyres circulate the whole lake, and wind pushes surface water toward shore where it returns as fast, narrow outflows, the same rip currents that catch swimmers and paddleboarders off guard. Fast water is invisible from the beach: check here before you go in, stay close to shore, and wear a life vest on any craft.
  waveHeightText:
    type: textarea
    title: 'Wave Height description'
    description: 'Shown beside the Wave Height view (below it on small screens). A blank line starts a new paragraph.'
    default_value: |-
      Forecasted wave heights driven by the wind forecast, lake-wide.

      Waves here are driven by wind: how hard it blows, how far it blows across open water (the fetch), and how deep that water is. The same wind builds much bigger waves on a long, exposed shore than in a sheltered bay, which is why the east and south shores can be rough while the west shore stays calm.
